<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soon Inventory — Maquette</title>
<script>
// Appliqué avant le premier rendu pour éviter le flash du mauvais thème.
function applyTheme(){var m=window.siMode||'light';try{m=window.siMode||localStorage.getItem('si-theme')||'light'}catch(e){}
  var d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.dataset.mode=m}
applyTheme();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8E7E3; --wash1:rgba(243,237,58,.38); --wash2:rgba(244,123,32,.20);
  --panel:rgba(255,255,255,.58); --field:rgba(255,255,255,.78); --ink:#19191D; --muted:#55555B;
  --line:rgba(25,25,29,.11); --rail-active:#fff; --shadow:0 10px 30px -14px rgba(25,25,29,.28);
  --orange:#F47B20; --yellow:#F3ED3A; --black:#16161A; --on-accent:#17171A; --on-black:#F4F4F1;
  --danger:#B3261E; --r:30px; --r-s:16px;
  --ui:"Manrope",system-ui,sans-serif; --txt:"Inter",system-ui,sans-serif;
}
:root[data-theme=dark]{
  --bg:#0E0F13; --wash1:rgba(244,123,32,.22); --wash2:rgba(244,123,32,.12);
  --panel:#1B1C22; --field:#25262D; --ink:#F3F3F0; --muted:#A6A7AE;
  --line:rgba(255,255,255,.10); --rail-active:#25262D; --shadow:0 14px 34px -16px rgba(0,0,0,.7);
  --black:#08090B; --danger:#FF8A80;
}
*{box-sizing:border-box}
html{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--ink);font:400 15px/1.5 var(--txt);
  background:radial-gradient(900px 520px at 0% 0%,var(--wash1),transparent 70%),
             radial-gradient(800px 480px at 55% -10%,var(--wash2),transparent 70%),var(--bg);
  background-attachment:fixed;caret-color:var(--orange);scrollbar-color:var(--muted) transparent}
::selection{background:var(--yellow);color:var(--on-accent)}
h1,h2,h3{font-family:var(--ui);font-weight:600;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(2rem,4.2vw,3.1rem);font-weight:500}
h2{font-size:1.45rem}h3{font-size:1.05rem}
p{margin:0}
.num{font-family:var(--ui);font-variant-numeric:tabular-nums;font-weight:600}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Shell */
.app{display:grid;grid-template-columns:92px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0}
.logo{width:40px;height:40px;margin-bottom:26px;color:var(--ink)}
.rail button{width:56px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--muted);transition:background .16s,color .16s}
.rail button:hover{color:var(--ink)}
.rail button[aria-current=page]{background:var(--rail-active);color:var(--ink);box-shadow:var(--shadow)}
[data-theme=dark] .rail button[aria-current=page]{box-shadow:inset 0 0 0 1.5px var(--orange);color:var(--orange)}
.rail .sp{flex:1}
main{padding:26px 34px 120px 6px;max-width:1500px;width:100%}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.top h1{margin-right:auto}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;background:var(--panel);
  border:1px solid var(--line);font-weight:500;white-space:nowrap}
.sync .dot{width:9px;height:9px;border-radius:50%;background:#3E9B4F}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.seg button{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px;backdrop-filter:blur(14px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;
  font-family:var(--ui);font-weight:600;transition:transform .16s cubic-bezier(.16,1,.3,1),box-shadow .16s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.btn:active{transform:none}
.btn.pri{background:var(--orange);color:var(--on-accent)}
.btn.dark{background:var(--black);color:var(--on-black)}
.btn.ghost{background:var(--field);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--field);border:1px solid var(--line);color:var(--muted)}
.icon-btn:hover{color:var(--ink)}.icon-btn.del:hover{color:var(--danger)}
.field{display:grid;gap:7px;font-weight:500}
.field input,.search input{min-height:54px;padding:0 18px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--field);width:100%;font-size:16px}
.field input::placeholder,.search input::placeholder{color:var(--muted)}
.search{position:relative;display:block}.search svg{position:absolute;left:16px;top:17px;color:var(--muted)}.search input{padding-left:46px}
.muted{color:var(--muted)}

/* Accueil */
.blocks{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:10px;margin-bottom:10px}
.block{border-radius:var(--r);padding:28px;min-height:330px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.block h2{font-size:1.7rem;font-weight:600;max-width:13ch}
.block p{margin-top:8px;max-width:30ch}
.block .btn{margin-top:auto;align-self:flex-start}
.b-or{background:var(--orange);color:var(--on-accent)}
.b-or::after{content:"";position:absolute;right:-90px;bottom:-110px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(23,23,26,.5) 1.6px,transparent 2px) 0 0/11px 11px;opacity:.55;pointer-events:none}
.b-ye{background:var(--yellow);color:var(--on-accent)}
.b-ye p{color:#3F3D12}
.b-bk{background:var(--black);color:var(--on-black)}
.b-bk p{color:#B9B9BE}
.bars{display:flex;align-items:flex-end;gap:5px;height:92px;position:absolute;right:26px;bottom:26px}
.bars i{width:22px;border-radius:12px 12px 0 0;display:block}
.bars i:nth-child(3n+1){background:repeating-linear-gradient(135deg,#17171A 0 3px,transparent 3px 8px)}
.bars i:nth-child(3n+2){background:linear-gradient(#17171A,rgba(23,23,26,.15))}
.bars i:nth-child(3n){background:radial-gradient(circle,#17171A 1.5px,transparent 2px) 0 0/8px 8px}
.saved{display:flex;align-items:center;gap:12px;margin-top:22px}
.saved .ok{width:44px;height:44px;border-radius:50%;background:var(--yellow);color:var(--on-accent);display:grid;place-items:center}
.b-bk .links{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}
.b-bk .btn.ghost{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.14);color:var(--on-black)}
.list-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.list-head h2{margin-right:auto}.list-head .search{flex:0 1 340px}
.rows{display:grid}
.row{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr .8fr .9fr 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.row.h{border:0;color:var(--muted);font-size:13px;padding-bottom:6px}
.row .ref{font-family:var(--ui);font-weight:600}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line);width:max-content}
.tag.done{background:var(--yellow);color:var(--on-accent);border-color:transparent}
.tag.draft{background:var(--orange);color:var(--on-accent);border-color:transparent}
.note{margin-top:18px;font-size:13px;color:var(--muted)}

/* Parcours */
.steps{display:flex;gap:6px;margin:0 0 22px;padding:0;list-style:none;flex-wrap:wrap}
.steps button{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 18px 0 8px;border-radius:999px;color:var(--muted);font-weight:500;border:1px solid var(--line);background:var(--panel)}
.steps b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--field);font-family:var(--ui);font-variant-numeric:tabular-nums}
.steps button[aria-current=step]{background:var(--ink);color:var(--bg);border-color:transparent}
.steps button[aria-current=step] b{background:var(--orange);color:var(--on-accent)}
.steps button.done b{background:var(--yellow);color:var(--on-accent)}
.stage h2{margin-bottom:6px}.stage>.muted{margin-bottom:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{min-height:52px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:var(--field);font-family:var(--ui);font-weight:600}
.chip[aria-pressed=true]{background:var(--orange);color:var(--on-accent);border-color:transparent}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.v3d{height:300px;display:grid;align-items:center;overflow:hidden}
.v3d canvas{display:block;touch-action:pan-y;cursor:grab}
.bar2d{display:flex;height:84px;border-radius:14px;overflow:hidden;border:2px solid var(--ink)}
.leg{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 26px}
.leg li{display:flex;gap:10px;align-items:center}.leg i{width:14px;height:14px;border-radius:4px;flex:none}.leg li>span:first-of-type{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px}
.chip.sm{min-height:44px;padding:0 16px;font-size:14px}
.chip.rm{padding-right:8px}.chip.rm button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.chip.rm button:hover{color:var(--danger)}
.sep{width:1px;background:var(--line);margin:0 6px}
.setg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;align-items:start}
.setg h2,.np h2{margin-bottom:16px}
.np{display:grid;gap:14px}.np h2{margin:0}
.addrow{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.addrow .field{flex:1 1 180px}
.prev{padding:14px 18px;border-radius:var(--r-s);background:var(--black);color:var(--on-black);font-family:var(--ui);font-weight:600}
.prev small{display:block;color:#B9B9BE;font:400 13px var(--txt);margin-top:2px}
.prow{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}.prow .d{flex:1 1 220px;font-family:var(--ui);font-weight:600}
.warn{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:14px 16px;border-radius:var(--r-s);background:rgba(244,123,32,.16);border:1px solid var(--orange);font-weight:500}
.conts{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.cont{background:var(--black);color:var(--on-black);border-radius:var(--r);padding:24px;display:grid;gap:14px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 2px,transparent 2px 26px)}
.cont .field input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:var(--on-black);font-family:var(--ui);letter-spacing:.04em}
.cont .field input::placeholder{color:#8E8E95}
.cont .icon-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#C9C9CE}
.cont-h{display:flex;align-items:center;gap:8px}.cont-h h3{margin-right:auto;font-size:1.2rem}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--orange)}
.cont-f{display:flex;gap:22px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);color:#B9B9BE}
.cont-f .num{color:var(--yellow);font-size:1.25rem;margin-right:5px}
.addc{border:1.5px dashed var(--muted);border-radius:var(--r);min-height:200px;display:grid;place-items:center;gap:8px;align-content:center;font-family:var(--ui);font-weight:600;color:var(--muted)}
.addc:hover{color:var(--ink);border-color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:500}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:transparent}
.goods{display:grid;grid-template-columns:minmax(280px,.8fr) 1.4fr;gap:10px;align-items:start}
.cat{display:grid;gap:6px;margin-top:12px}
.prod{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--field)}
.prod:hover{border-color:var(--orange)}
.prod span{flex:1;font-family:var(--ui);font-weight:600}.prod small{color:var(--muted);font-family:var(--txt);font-weight:400;display:block;font-size:13px}
.prod .plus{width:36px;height:36px;border-radius:50%;background:var(--orange);color:var(--on-accent);display:grid;place-items:center}
.prod.in .plus{background:var(--yellow)}
.line{display:grid;grid-template-columns:1fr auto 110px 44px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line .d{font-family:var(--ui);font-weight:600}.line .w{text-align:right}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:44px;height:48px;border-radius:14px;background:var(--field);border:1px solid var(--line);font-size:20px;font-weight:600}
.qty input{width:96px;height:48px;text-align:center;border-radius:14px;border:1px solid var(--line);background:var(--field);font:600 18px var(--ui);font-variant-numeric:tabular-nums}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.recap{display:grid;gap:0}
.rc{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px;padding:14px 4px;border-top:1px solid var(--line);align-items:center}
.rc.h{border:0;color:var(--muted);font-size:13px}.rc.t{font-size:1.15rem;border-top:2px solid var(--ink)}
.rc>:nth-child(n+3){text-align:right}
.alerts{display:grid;gap:8px;margin-bottom:16px}
.okmsg{display:flex;gap:10px;align-items:center;padding:14px 16px;border-radius:var(--r-s);background:var(--yellow);color:var(--on-accent);font-weight:600;margin-bottom:16px}
.bar{position:fixed;left:92px;right:0;bottom:0;padding:14px 34px 18px 6px;display:flex;gap:12px;align-items:center;
  background:linear-gradient(transparent,var(--bg) 38%);z-index:5}
.bar .tot{margin-right:auto;display:flex;gap:26px;padding:0 24px;min-height:56px;align-items:center;border-radius:999px;background:var(--black);color:var(--on-black)}
.bar .tot .num{font-size:1.3rem;color:var(--yellow);margin-right:6px}

/* Document : toujours une feuille blanche, quel que soit le thème */
.docwrap{display:grid;gap:18px;justify-items:center}
.sheet{background:#fff;color:#111;width:min(100%,720px);padding:44px 48px;border-radius:6px;box-shadow:0 24px 50px -24px rgba(0,0,0,.45);font:500 15px/1.5 Arial,Helvetica,sans-serif}
.sheet dl{margin:0 0 26px;display:grid;gap:6px}
.sheet dl div{display:grid;grid-template-columns:210px 1fr;gap:10px}
.sheet dt{font-weight:700}.sheet dd{margin:0;font-weight:700}
.sheet table{width:100%;border-collapse:collapse}
.sheet th,.sheet td{border:1.5px solid #111;padding:9px 12px;text-align:left}
.sheet thead th{text-align:center;background:#EDEDED}
.sheet td:last-child,.sheet tfoot td{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sheet tfoot th{background:#EDEDED}

@media (max-width:1100px){.blocks{grid-template-columns:1fr 1fr}.b-or{grid-column:1/-1;min-height:230px}
  .row{grid-template-columns:1.3fr 1fr .9fr 1fr auto}.row>:nth-child(3),.row>:nth-child(4),.row>:nth-child(6){display:none}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;justify-content:space-around;padding:8px 8px 10px;background:var(--bg);border-top:1px solid var(--line);z-index:6}
  .rail .logo,.rail .sp{display:none}
  body.wiz .rail{display:none}
  main{padding:18px 16px 130px}
  .blocks{grid-template-columns:1fr}.block{min-height:220px;padding:22px}
  .bars{display:none}.b-or::after{right:-150px;bottom:-170px}.block .btn{margin-top:18px}
  .row.h{display:none}.row{grid-template-columns:1fr auto;gap:4px 12px}.row>:nth-child(5){display:none}
  .g2,.goods{grid-template-columns:1fr}.conts{grid-template-columns:1fr}
  body.wiz .seg{display:none}.steps{gap:4px;flex-wrap:nowrap}.steps b{width:28px;height:28px}
  .steps button span{display:none}.steps button{padding:0 5px;min-height:40px}
  .steps button[aria-current=step] span{display:inline}.steps button[aria-current=step]{padding-right:16px}
  .line{grid-template-columns:1fr 44px;row-gap:8px}.line .w{text-align:left;grid-column:1}.line .qty{grid-column:1/-1;grid-row:2}.line .w{grid-row:3}
  .qty input{flex:1}
  .rc{grid-template-columns:1.2fr 1fr 1fr}.rc>:nth-child(2){display:none}
  .bar{left:0;padding:12px 16px 14px;flex-wrap:wrap}.bar .tot{flex:1 1 100%;justify-content:center;gap:18px}.bar .btn{flex:1}
  .sheet{padding:26px 18px}.sheet dl div{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body{background:#fff}.rail,.top,.steps,.bar,.tabs,.stage>h2,.stage>.muted{display:none!important}
  main{padding:0}.sheet{box-shadow:none;break-after:page;width:100%}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Navigation principale" id="rail"></nav>
  <main id="main"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const nf=n=>n.toLocaleString('fr-FR'), kg=g=>nf(g/1000);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id'+Math.random().toString(36).slice(2);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const IC={home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 cont:'<rect x="2" y="7" width="20" height="11" rx="1.5"/><path d="M7 7v11M12 7v11M17 7v11"/>',
 pack:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
 file:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 set:'<path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',check:'<path d="m5 12 5 5L20 7"/>',
 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 right:'<path d="M5 12h14M13 6l6 6-6 6"/>',left:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>',
 moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>',

    cv.onpointerdown=e=>{drag=e.clientX;cv.setPointerCapture(e.pointerId)};
    cv.onpointermove=e=>{if(drag!=null){g.rotation.y+=(e.clientX-drag)*.01;drag=e.clientX}};
    cv.onpointerup=cv.onpointercancel=()=>drag=null;
    V3={r};const loop=()=>{if(!el.isConnected)return;if(drag==null)g.rotation.y+=.0025;r.render(sc,cam);V3.raf=requestAnimationFrame(loop)};loop();
  }).catch(()=>{})}
const fdate=v=>{if(!v)return '—';const d=new Date(v+'T00:00');return d.toLocaleDateString('fr-FR',{weekday:'long'}).toUpperCase()+', '+d.toLocaleDateString('fr-FR')};
function sheet(c){const s=S.ship,t=tot(c),r=(k,v)=>`<div><dt>${k} :</dt><dd>${v}</dd></div>`;
  return `<section class="sheet"><dl>${r('DESTINATION',esc(s.dest||'—').toUpperCase())}${r('DATE DE DEPOT',fdate(c.custom?c.depot:s.depot))}${r('DATE DE DEPART',fdate(c.custom?c.depart:s.depart))}
   ${r('NUMERO DE PLOMB',esc(c.seal||'—').toUpperCase())}${r('NUMERO CONTENEUR',esc(c.number||'—').toUpperCase())}</dl>
   <table><thead><tr><th>DESIGNATION</th><th>NOMBRE DE CARTON</th></tr></thead>
   <tbody>${c.items.map(it=>`<tr><td>${it.des.toUpperCase()}</td><td>${nf(it.qty)}</td></tr>`).join('')}</tbody>
   <tfoot><tr><th>NOMBRE TOTAL DE CARTON</th><td>${nf(t.n)} cartons</td></tr><tr><th>TONNAGE TOTAL DU CONTENEUR</th><td>${kg(t.g)} kg</td></tr></tfoot></table></section>`}
function s4(){const cs=S.ship.containers,g=S.doc==='all',all=cs.reduce((t,c)=>{const x=tot(c);return{n:t.n+x.n,g:t.g+x.g}},{n:0,g:0});
  return `<h2>Votre document</h2><p class="muted">Voici la feuille telle qu'elle sera imprimée.</p>
  <div class="tabs">${cs.map((c,i)=>`<button data-act="doc" data-v="${i}" aria-selected="${S.doc==i}">Conteneur ${i+1}</button>`).join('')}
   ${cs.length>1?`<button data-act="doc" data-v="all" aria-selected="${g}">Document global</button>`:''}
   <button data-act="soon" style="margin-left:auto">${ico('file')} Excel</button></div>
  <div class="docwrap">${g?cs.map(sheet).join('')+`<section class="sheet"><table><thead><tr><th colspan="2">RECAPITULATIF GENERAL</th></tr></thead>
    <tfoot><tr><th>NOMBRE DE CONTENEURS</th><td>${cs.length}</td></tr><tr><th>NOMBRE TOTAL DE CARTON</th><td>${nf(all.n)} cartons</td></tr><tr><th>TONNAGE TOTAL</th><td>${kg(all.g)} kg</td></tr></tfoot></table></section>`
   :sheet(cs[S.doc]||cs[0])}</div>`}

function nums(){const s=S.ship;if(!s)return;const m={N:0,G:0};
  s.containers.forEach((c,i)=>{const t=tot(c);m['n'+i]=t.n;m['g'+i]=t.g;m.N+=t.n;m.G+=t.g;if(i===S.cur)c.items.forEach((it,j)=>m['l'+j]=it.qty*it.unitG)});
  $$('[data-n]').forEach(el=>{const k=el.dataset.n,v=m[k]||0,w=k!=='N'&&k[0]!=='n',from=el._v;el._v=v;el._t&&el._t.kill();
    if(from==null||from===v||!window.gsap||RM){el.textContent=w?kg(v):nf(v);return}
    const o={x:from};el._t=gsap.to(o,{x:v,duration:.45,ease:'expo.out',onUpdate(){el.textContent=nf(Math.round(w?o.x/1000:o.x))},onComplete(){el.textContent=w?kg(v):nf(v)}})})}
function render(dir){document.body.classList.toggle('wiz',S.view==='wiz');rail();
  $('#main').innerHTML=S.view==='home'?home():({wiz:wizard,hist,prod,set:sett})[S.view]();
  nums();view3d();
  const st=$('#stage');if(dir&&st&&window.gsap&&!RM)gsap.from(st,{x:28*dir,opacity:0,duration:.4,ease:'expo.out',clearProps:'all'})}
function go(n){const d=n>S.step?1:-1;S.step=Math.max(0,Math.min(STEPS.length-1,n));if(S.cur>=S.ship.containers.length)S.cur=0;render(d);scrollTo(0,0)}
function start(ex){Object.assign(S,{view:'wiz',step:0,cur:0,q:'',doc:'0',ship:newShip(ex)});render(1)}

const ACT={nav:v=>{Object.assign(S,{view:v,hq:'',hs:'',hd:'',pq:''});render()},
  hf:v=>{const[k,x]=v.split(':');S[k]=x;render()},npu:v=>{S.np.unit=v;render()},
  addprod:()=>{P.push(npState().p);S.np={name:'',w:'',unit:'kg',per:''};render()},
  deld:v=>{DESTS.splice(v,1);render()},addd:()=>{const v=$('#nd').value.trim();if(v&&!DESTS.includes(v))DESTS.push(v);render()},new:()=>start(false),resume:()=>start(true),quit:()=>{S.view='home';render()},
  step:v=>go(+v),next:()=>go(S.step+1),prev:()=>go(S.step-1),
  dest:v=>{S.ship.dest=v;render()},addc:()=>{S.ship.containers.push(newCont());render()},
  dupc:v=>{const c=S.ship.containers[v];S.ship.containers.splice(+v+1,0,{...c,id:uid(),number:'',seal:'',items:c.items.map(it=>({...it}))});render()},
  delc:v=>{const c=S.ship.containers[v];if(c.items.length&&!confirm(`Supprimer le conteneur ${+v+1} et ses ${c.items.length} produits ?`))return;S.ship.containers.splice(v,1);S.cur=0;render()},
  tab:v=>{S.cur=+v;render()},doc:v=>{S.doc=v;render()},print:()=>print(),
  addp:v=>{const c=cur();let j=c.items.findIndex(it=>it.pid===v);if(j<0){c.items.push(item(P.find(p=>p.id===v),0));j=c.items.length-1}render();const i=$(`[data-q="${j}"]`);i.focus();i.select()},
  inc:v=>{cur().items[v].qty++;sync(v)},dec:v=>{const it=cur().items[v];it.qty=Math.max(0,it.qty-1);sync(v)},
  delit:v=>{cur().items.splice(v,1);render()},
  theme:v=>{window.siMode=v;try{localStorage.setItem('si-theme',v)}catch(e){}applyTheme();render()},
  soon:()=>alert('Cette action n\'est pas branchée dans la maquette.')};
function sync(j){$(`[data-q="${j}"]`).value=cur().items[j].qty||'';nums()}

addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)ACT[b.dataset.act](b.dataset.v)});
addEventListener('input',e=>{const t=e.target,s=S.ship;
  if(t.id==='hq'){S.hq=t.value;$('#hrows').innerHTML=hrows()}
  else if(t.id==='pq'){S.pq=t.value;$('#prows').innerHTML=prodRows()}
  else if(t.dataset.np){S.np[t.dataset.np]=t.value;const{p,dup}=npState();$('#npprev').innerHTML=npPrev();$('#npadd').disabled=!p||dup}
  else if(t.dataset.pon)P.find(p=>p.id===t.dataset.pon).on=t.checked;
  else if(t.id==='q'){S.q=t.value;$('#cat').innerHTML=catalog()}
  else if(t.dataset.f)s[t.dataset.f]=t.value;
  else if(t.dataset.cf)s.containers[t.dataset.c][t.dataset.cf]=t.type==='checkbox'?t.checked:t.value;
  else if(t.dataset.q!=null){cur().items[t.dataset.q].qty=Math.max(0,parseInt(t.value,10)||0);nums()}});
addEventListener('change',e=>{if(e.target.type==='date'||e.target.type==='checkbox')render()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
render();
</script>
</body>
</html>
